name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nuniesmith/actions/.github/actions/rust-ci@v1
        with:
          all-features: "true"

  publish:
    name: publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    uses: nuniesmith/actions/.github/workflows/rust-crate-publish.yml@v1
    secrets: inherit
